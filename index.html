<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page</title>
    <style>
        /* Remove default margins and padding to ensure full screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Make the embedded site fill the entire screen smoothly */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Removes the default frame border */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Replace the src URL with the website you want to embed -->
    <iframe src="cdn.wasmer.app" title="Page"></iframe>

</body>
</html>
